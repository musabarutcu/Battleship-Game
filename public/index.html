<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemileri Batır — Multiplayer</title>
  <meta name="description" content="Arkadaşlarınla gerçek zamanlı Gemileri Batır oyna">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- LOBBY -->
  <div id="lobby-screen" class="screen active">
    <div class="lobby-card">
      <img src="logo-text.png" alt="Gemileri Batır" style="max-width:180px; margin:0 auto 10px; display:block;">
      <p class="lobby-subtitle" style="font-size:1.1rem;">Hoş geldin cınım</p>
      <div class="input-group">
        <label for="nickname-input">Takma Ad</label>
        <input type="text" id="nickname-input" placeholder="Adını gir..." maxlength="16" autocomplete="off">
      </div>
      <button class="btn btn-primary" id="btn-create">Oda Oluştur</button>
      <div class="waiting-section" id="waiting-section">
        <div class="waiting-text">Oda Kodu</div>
        <div class="room-code-big" id="room-code-display">-----</div>
        <div class="invite-link-row">
          <input type="text" id="invite-link-input" class="invite-link-input" readonly>
          <button class="btn-copy-link" id="btn-copy-link" title="Linki kopyala">🔗</button>
        </div>
        <div class="copy-confirm" id="copy-confirm">✓ Link kopyalandı!</div>
        <img class="waiting-anchor-img" src="logo-icon.png" alt="⚓">
        <div class="waiting-text">Rakip bekleniyor...</div>
      </div>
      <div class="divider">veya</div>
      <div class="input-group">
        <label for="code-input">Oda Kodu</label>
        <div class="join-row">
          <input type="text" id="code-input" placeholder="5 haneli kod" maxlength="5" autocomplete="off">
          <button class="btn btn-secondary" id="btn-join">Katıl</button>
        </div>
      </div>
      <div class="lobby-error" id="lobby-error"></div>
    </div>
  </div>

  <!-- GAME -->
  <div id="game-screen" class="screen">
    <div class="top-bar">
      <div class="player-info left">
        <div class="avatar p1" id="p1-avatar">?</div>
        <span class="player-name" id="p1-name">Oyuncu 1</span>
      </div>
      <div class="turn-center">
        <div class="turn-label">Durum</div>
        <div class="turn-status" id="turn-status">Gemilerini Yerleştir</div>
        <div class="room-code-small" id="room-code-small"></div>
      </div>
      <div class="player-info right">
        <div class="avatar p2" id="p2-avatar">?</div>
        <span class="player-name" id="p2-name">Oyuncu 2</span>
      </div>
    </div>

    <div class="game-content">
      <div id="rematch-container" style="display:none; text-align:center; width:100%; margin-bottom:12px;">
        <button class="btn btn-primary" id="btn-rematch-top" style="font-size: 1.1rem; padding: 12px 32px; border-radius: 30px;">Yeniden Oyna</button>
      </div>
      <div class="status-msg" id="status-msg"></div>
      <div class="mobile-tabs" id="mobile-tabs">
        <button class="active" data-tab="my">Kendi Filon</button>
        <button data-tab="opp">Rakip Filo</button>
      </div>
      <div class="boards-area">
        <div class="board-with-fleet">
          <div class="fleet-status fleet-left" id="my-fleet"></div>
          <div class="board-panel" id="my-board-panel">
            <div class="board-panel-title">Kendi Filon</div>
            <div class="board-grid" id="my-grid"></div>
          </div>
        </div>
        <div class="board-with-fleet">
          <div class="board-panel" id="opp-board-panel">
            <div class="board-panel-title">Rakip Filo</div>
            <div class="board-grid" id="opp-grid"></div>
          </div>
          <div class="fleet-status fleet-right" id="opp-fleet"></div>
        </div>
      </div>
      <!-- Ship Dock (kompakt, yerleştirme aşamasında görünür) -->
      <div class="ship-dock" id="ship-dock">
        <div class="dock-ships" id="dock-ships"></div>
        <div class="dock-controls">
          <button class="btn btn-secondary btn-sm" id="btn-reset">Sıfırla</button>
          <button class="btn btn-secondary btn-sm" id="btn-random">Rastgele</button>
          <button class="btn btn-primary btn-sm" id="btn-ready" disabled>Hazırım</button>
        </div>
      </div>
      <!-- Battle Helper Buttons -->
      <div class="battle-helpers" id="battle-helpers" style="display:none;">
        <button class="btn btn-toggle btn-sm" id="btn-adj-hint" title="Vurduğun gemilerin yanındaki kareleri işaretle">
          <span id="adj-hint-icon">✓</span> Komşu İpucu
        </button>
      </div>
      <!-- Chat Panel -->
      <div class="chat-panel" id="chat-panel">
        <div class="chat-header">💬 Sohbet</div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-bottom">
          <div class="chat-quick">
            <button data-msg="NABER CINIM?">NABER CINIM?</button>
            <button data-msg="SENİ SEVİYORUM CINIM!!">SENİ SEVİYORUM CINIM!!</button>
            <button data-msg="KARADENİZDE GEMİLERİN Mİ BATTI CINIM">KARADENİZDE GEMİLERİN Mİ BATTI CINIM</button>
            <button data-msg="HURMA MOLASI!">HURMA MOLASI!</button>
          </div>
          <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Mesaj yaz..." maxlength="100" autocomplete="off">
            <button id="chat-send">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Over -->
  <div class="game-over-overlay" id="game-over-overlay">
    <div class="game-over-card">
      <div class="game-over-icon" id="go-icon">🏆</div>
      <div class="game-over-title" id="go-title">Kazandın!</div>
      <div class="game-over-sub" id="go-sub">Tebrikler!</div>
      <div class="go-stats" id="go-stats">
        <div class="go-stat"><div class="go-stat-val" id="stat-hits">0</div><div class="go-stat-lbl">İsabet</div></div>
        <div class="go-stat"><div class="go-stat-val" id="stat-misses">0</div><div class="go-stat-lbl">Iska</div></div>
        <div class="go-stat"><div class="go-stat-val" id="stat-accuracy">0%</div><div class="go-stat-lbl">Oran</div></div>
        <div class="go-stat"><div class="go-stat-val" id="stat-time">0:00</div><div class="go-stat-lbl">Süre</div></div>
      </div>
      <div class="go-progress-bar"><div class="go-progress-fill"></div></div>
    </div>
  </div>

  <!-- Rematch Wait -->
  <div class="game-over-overlay" id="rematch-wait-overlay">
    <div class="game-over-card" style="padding:40px 20px; position:relative;">
      <button class="overlay-close-btn" id="btn-rematch-cancel" title="İptal et">✕</button>
      <div class="game-over-icon">⏳</div>
      <div class="game-over-title" style="color:var(--navy);font-size:1.4rem">Rakip Bekleniyor</div>
      <div class="game-over-sub" style="margin-bottom:0">Rakibin de "Yeniden Oyna" butonuna basması bekleniyor...</div>
    </div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
